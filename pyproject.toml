[project]
name = "graana"
version = "0.1.0"
description = "Graana Market Intelligence — data pipeline, API, and dashboard backend"
authors = [
    { name = "Lazygeniusbilal", email = "bilal.ahmed38980@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]
